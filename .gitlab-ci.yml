stages:
  - build

# Build Backend
build_backend:
  stage: build
  tags:
    - docker
  image: gitlab/python:3.9  # <- this one has dumb-init preinstalled
  script:
    - cd backend
    - pip install -r requirements.txt
    - echo "Backend dependencies installed ✓"

# Build Frontend
build_frontend:
  stage: build
  tags:
    - docker  # Force use of Docker runner
  image: node:20
  script:
    - cd frontend
    - npm install
    - npm run build
    - echo "Frontend built ✓"